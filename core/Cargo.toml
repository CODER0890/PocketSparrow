[package]
name = "pocket-sparrow-core"
version = "0.1.0"
edition = "2021"
authors = ["Pocket Sparrow Team"]
description = "100% On-Device Two-Tier Threat Detection Engine for Android and Desktop"

[lib]
name = "pocket_sparrow"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
lazy_static = "1.4"
jni = { version = "0.21", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
