name: Build Windows Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          cd desktop
          npm install

      - name: Build Tauri Desktop (NSIS Installer)
        run: |
          cd desktop
          npm run tauri build

      - name: Rename Setup Binary
        shell: bash
        run: |
          mkdir -p release-bin
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe release-bin/Pocket-Sparrow-Setup.exe || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-bin/Pocket-Sparrow-Setup.exe
